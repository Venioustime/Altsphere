steps:
- name: Checkout code
  uses: actions/checkout@v3

- name: Cleanup space
  run: |
    # Nettoyage plus agressif
    sudo rm -rf /home/runner/_work/_temp
    sudo rm -rf /home/runner/.npm
    sudo rm -rf /home/runner/.cache

- name: Setup Node.js
  uses: actions/setup-node@v3
  with:
    node-version: 18 # À adapter à votre version
    cache: 'npm'

- name: Install dependencies
  run: |
    npm ci --prefer-offline --no-audit
  env:
    NODE_OPTIONS: '--max_old_space_size=4096' # Augmente la mémoire disponible