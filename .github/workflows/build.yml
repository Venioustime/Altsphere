name: Build and Deploy  # Nom du workflow

on: [push]  # Déclenché à chaque "push"

jobs:
  build:
    runs-on: ubuntu-latest  # Environnement d'exécution

    steps:
    # Étape 1 : Récupérer le code
    - name: Checkout code
      uses: actions/checkout@v3

    # Étape 2 : Nettoyer l'espace disque (spécifique à votre problème)
    - name: Cleanup disk space
      run: sudo rm -rf /home/runner/_work/_temp

    # Étape 3 : Installer les dépendances
    - name: Install dependencies
      run: npm install

    # Étape 4 : Compiler le projet
    - name: Build project
      run: npm run build

    # Étape 5 : DÉPLOIEMENT (à personnaliser selon votre besoin)
    # ... ajoutez vos étapes de déploiement ici ...